<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chutes TPS Leaderboard</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #0a0a0f;
        color: #e0e0e8;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        min-height: 100vh;
        line-height: 1.5;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 16px;
      }

      header {
        text-align: center;
        margin-bottom: 32px;
      }

      header h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #00d4ff;
        text-shadow:
          0 0 20px rgba(0, 212, 255, 0.3),
          0 0 60px rgba(0, 212, 255, 0.1);
        margin-bottom: 8px;
      }

      header .subtitle {
        color: #8888a0;
        font-size: 0.95rem;
      }

      header .updated {
        color: #666680;
        font-size: 0.8rem;
        margin-top: 8px;
        font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      }

      .search {
        margin-bottom: 20px;
        display: flex;
        justify-content: center;
      }

      .search input {
        width: 100%;
        max-width: 480px;
        padding: 10px 16px;
        background: #12121a;
        border: 1px solid #2a2a3a;
        border-radius: 8px;
        color: #e0e0e8;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .search input::placeholder {
        color: #555568;
      }
      .search input:focus {
        border-color: #00d4ff;
        box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.15);
      }

      .table-wrap {
        background: #12121a;
        border-radius: 12px;
        border: 1px solid #1e1e2e;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 800px;
      }

      th {
        background: #16161f;
        color: #8888a0;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 12px 16px;
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        transition: color 0.2s;
        position: sticky;
        top: 0;
      }

      th:hover {
        color: #00d4ff;
      }
      th .indicator {
        font-size: 0.7rem;
        margin-left: 4px;
      }

      td {
        padding: 12px 16px;
        border-top: 1px solid #1a1a28;
        font-size: 0.9rem;
        white-space: nowrap;
      }

      tr:hover td {
        background: rgba(0, 212, 255, 0.03);
      }

      .num {
        font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
        font-variant-numeric: tabular-nums;
      }

      .rank {
        color: #666680;
        font-weight: 600;
        text-align: center;
        width: 48px;
      }

      .model-name {
        font-weight: 500;
        max-width: 320px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .model-unknown {
        color: #555568;
        font-style: italic;
      }

      .tps-highlight {
        color: #00d4ff;
        font-weight: 600;
      }

      .row-gold {
        border-left: 3px solid #ffd700;
      }
      .row-gold .rank {
        color: #ffd700;
      }

      .row-silver {
        border-left: 3px solid #c0c0c0;
      }
      .row-silver .rank {
        color: #c0c0c0;
      }

      .row-bronze {
        border-left: 3px solid #cd7f32;
      }
      .row-bronze .rank {
        color: #cd7f32;
      }

      .loading {
        text-align: center;
        padding: 64px 16px;
        color: #555568;
      }

      .spinner {
        display: inline-block;
        width: 32px;
        height: 32px;
        border: 3px solid #1e1e2e;
        border-top-color: #00d4ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .refreshing {
        text-align: center;
        padding: 8px;
        color: #00d4ff;
        font-size: 0.8rem;
        opacity: 0.7;
      }

      .error-banner {
        background: rgba(255, 60, 60, 0.1);
        border: 1px solid rgba(255, 60, 60, 0.3);
        border-radius: 8px;
        padding: 16px 24px;
        text-align: center;
        margin-bottom: 20px;
        color: #ff6b6b;
      }

      .error-banner button {
        margin-top: 8px;
        padding: 6px 20px;
        background: rgba(255, 60, 60, 0.2);
        border: 1px solid rgba(255, 60, 60, 0.4);
        border-radius: 6px;
        color: #ff6b6b;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background 0.2s;
      }

      .error-banner button:hover {
        background: rgba(255, 60, 60, 0.3);
      }

      footer {
        text-align: center;
        padding: 24px 0 16px;
        color: #444458;
        font-size: 0.8rem;
        font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
      }

      @media (max-width: 640px) {
        header h1 {
          font-size: 1.5rem;
        }
        .container {
          padding: 16px 8px;
        }
        td,
        th {
          padding: 10px 12px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>⚡ Chutes TPS Leaderboard</h1>
        <p class="subtitle">Real-time throughput rankings for LLM models on Chutes.ai</p>
        <p class="updated" id="updated"></p>
      </header>

      <div class="search">
        <input type="text" id="search" placeholder="Search models..." autocomplete="off" spellcheck="false" />
      </div>

      <div id="error"></div>
      <div id="refreshing"></div>

      <div class="table-wrap">
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <div>Loading leaderboard...</div>
        </div>
        <table id="table" style="display: none">
          <thead>
            <tr>
              <th data-key="rank">#</th>
              <th data-key="name">Model</th>
              <th data-key="latest_tps">Latest TPS</th>
              <th data-key="latest_ttft">TTFT</th>
              <th data-key="latest_requests">Requests</th>
              <th data-key="avg_7d">7d Avg</th>
              <th data-key="avg_30d">30d Avg</th>
              <th data-key="peak_tps">Peak TPS</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <footer id="footer"></footer>
    </div>

    <script>
      const API = "https://chutes-tps-leaderboard.mugnimaestra2.workers.dev/api/models"
      const INTERVAL = 300000

      let models = []
      let sortKey = "latest_tps"
      let sortDir = "desc"
      let searchQuery = ""
      let loaded = false
      let countdown = INTERVAL / 1000
      let timer = null

      const $ = (id) => document.getElementById(id)

      function formatTps(v) {
        return v != null ? v.toFixed(2) : "—"
      }

      function formatTtft(v) {
        return v != null ? v.toFixed(3) + "s" : "—"
      }

      function formatRequests(v) {
        return v != null ? v.toLocaleString() : "—"
      }

      function showError(msg) {
        $("error").innerHTML =
          '<div class="error-banner">' + "<div>" + msg + "</div>" + '<button onclick="load()">Retry</button>' + "</div>"
      }

      function clearError() {
        $("error").innerHTML = ""
      }

      async function load() {
        clearError()
        if (loaded) {
          $("refreshing").innerHTML = '<div class="refreshing">Refreshing...</div>'
        }
        try {
          const res = await fetch(API)
          if (!res.ok) throw new Error("HTTP " + res.status)
          const data = await res.json()
          models = data.models || []
          $("updated").textContent = "Last updated: " + new Date(data.scraped_at).toLocaleString()
          loaded = true
          $("loading").style.display = "none"
          $("table").style.display = ""
          render()
        } catch (e) {
          if (!loaded) $("loading").style.display = "none"
          showError("Failed to load data: " + e.message)
        } finally {
          $("refreshing").innerHTML = ""
          countdown = INTERVAL / 1000
        }
      }

      function render() {
        const query = searchQuery.toLowerCase()
        const filtered = query ? models.filter((m) => m.name.toLowerCase().includes(query)) : models.slice()

        const dir = sortDir === "asc" ? 1 : -1
        filtered.sort((a, b) => {
          const av = sortKey === "name" ? a.name.toLowerCase() : (a[sortKey] ?? -Infinity)
          const bv = sortKey === "name" ? b.name.toLowerCase() : (b[sortKey] ?? -Infinity)
          return av > bv ? dir : av < bv ? -dir : 0
        })

        // Update header indicators
        document.querySelectorAll("th[data-key]").forEach((th) => {
          const ind = th.querySelector(".indicator")
          if (ind) ind.remove()
          if (th.dataset.key === sortKey) {
            const span = document.createElement("span")
            span.className = "indicator"
            span.textContent = sortDir === "asc" ? " ▲" : " ▼"
            th.appendChild(span)
          }
        })

        const rows = filtered
          .map((m, i) => {
            const rank = i + 1
            const cls = rank === 1 ? "row-gold" : rank === 2 ? "row-silver" : rank === 3 ? "row-bronze" : ""
            const unknown = m.name === "[unknown]"
            const nameClass = "model-name" + (unknown ? " model-unknown" : "")
            return (
              '<tr class="' +
              cls +
              '">' +
              '<td class="rank num">' +
              rank +
              "</td>" +
              '<td class="' +
              nameClass +
              '" title="' +
              m.name.replace(/"/g, "&quot;") +
              '">' +
              m.name +
              "</td>" +
              '<td class="num tps-highlight">' +
              formatTps(m.latest_tps) +
              "</td>" +
              '<td class="num">' +
              formatTtft(m.latest_ttft) +
              "</td>" +
              '<td class="num">' +
              formatRequests(m.latest_requests) +
              "</td>" +
              '<td class="num">' +
              formatTps(m.avg_7d) +
              "</td>" +
              '<td class="num">' +
              formatTps(m.avg_30d) +
              "</td>" +
              '<td class="num">' +
              formatTps(m.peak_tps) +
              "</td>" +
              "</tr>"
            )
          })
          .join("")

        $("tbody").innerHTML =
          rows || '<tr><td colspan="8" style="text-align:center;color:#555568;padding:32px">No models found</td></tr>'
      }

      function sort(key) {
        if (key === "rank") return
        sortDir = sortKey === key ? (sortDir === "asc" ? "desc" : "asc") : "desc"
        sortKey = key
        render()
      }

      let debounce = null
      $("search").addEventListener("input", (e) => {
        clearTimeout(debounce)
        debounce = setTimeout(() => {
          searchQuery = e.target.value
          render()
        }, 200)
      })

      document.querySelector("thead tr").addEventListener("click", (e) => {
        const th = e.target.closest("th[data-key]")
        if (th) sort(th.dataset.key)
      })

      function tick() {
        countdown = Math.max(0, countdown - 1)
        $("footer").textContent = "Auto-refresh in " + countdown + "s · Chutes TPS Leaderboard"
      }

      document.addEventListener("DOMContentLoaded", () => {
        load()
        setInterval(load, INTERVAL)
        timer = setInterval(tick, 1000)
        tick()
      })
    </script>
  </body>
</html>
